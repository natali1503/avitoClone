name: Build and Deploy

on:
  push:
    branches: [ main, nstnkv ]

env:
  REGISTRY: ghcr.io
  IMAGE_CLIENT: ghcr.io/natali1503/avitoclone-client
  IMAGE_BACKEND: ghcr.io/natali1503/avitoclone-backend

jobs:
  detect_changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.filter.outputs.client }}
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
              - 'client/Dockerfile'
            backend:
              - 'server/**'
              - 'server/Dockerfile'

  build:
    name: Build and Push Images
    needs: detect_changes
    runs-on: ubuntu-latest
    environment: DEPLOY
    permissions:
      contents: read
      packages: write
    outputs:
      built_client: ${{ steps.flag-client.outputs.built || 'false' }}
      built_backend: ${{ steps.flag-backend.outputs.built || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- CLIENT ----------
      - name: Extract metadata for client
        if: needs.detect_changes.outputs.client_changed == 'true'
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_CLIENT }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client image
        if: needs.detect_changes.outputs.client_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_CLIENT }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_CLIENT }}:cache,mode=max

      - name: flag client built
        if: needs.detect_changes.outputs.client_changed == 'true'
        id: flag-client
        run: echo "built=true" >> "$GITHUB_OUTPUT"

      # ---------- BACKEND ----------
      - name: Extract metadata for backend
        if: needs.detect_changes.outputs.backend_changed == 'true'
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        if: needs.detect_changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache,mode=max

      - name: flag backend built
        if: needs.detect_changes.outputs.backend_changed == 'true'
        id: flag-backend
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Server
    needs: [build]
    runs-on: ubuntu-latest
    environment: DEPLOY
    # деплой только если что-то реально собрали/опубликовали
    if: needs.build.outputs.built_client == 'true' || needs.build.outputs.built_backend == 'true'

    steps:
      - name: Deploy to production server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.FINGERPRINT }}
          script_stop: true
          script: |
            set -euo pipefail
            STACK_DIR=/srv/adboard
            COMPOSE_FILE=docker-compose.prod.yml
            cd "$STACK_DIR"

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo docker compose -f "$COMPOSE_FILE" pull
            sudo docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            sudo docker image prune -f
            sudo docker logout ghcr.io

      - name: Deploy to test server
        if: github.ref == 'refs/heads/nstnkv'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.FINGERPRINT }}
          script_stop: true
          script: |
            set -euo pipefail
            STACK_DIR=/srv/adboard
            COMPOSE_FILE=docker-compose.prod.yml
            cd "$STACK_DIR"

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            sudo docker compose -f "$COMPOSE_FILE" pull
            sudo docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            sudo docker image prune -f
            sudo docker logout ghcr.io
