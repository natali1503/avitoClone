name: Build and Deploy

on:
  push:
    branches: [ main, nstnkv ]

env:
  REGISTRY: ghcr.io
  IMAGE_CLIENT: ghcr.io/natali1503/avitoclone-client
  IMAGE_BACKEND: ghcr.io/natali1503/avitoclone-backend

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: DEPLOY
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_CLIENT }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: DEPLOY
    
    steps:
      - name: Deploy to production server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.FINGERPRINT }}
          script_stop: true
          script: |
            set -euo pipefail
      
            # === переменные ===
            STACK_DIR=/srv/adboard
            COMPOSE_FILE=docker-compose.prod.yml
      
            cd "$STACK_DIR"
      
            # === обеспечить наличие docker compose ===
            if ! sudo docker compose version >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y docker-compose-plugin
              else
                apt-get update -y
                apt-get install -y docker-compose-plugin
              fi
            fi
      
            # === логин в GHCR (приватные образы) ===
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
            # === деплой ===
            sudo docker compose -f "$COMPOSE_FILE" pull
            sudo docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
      
            # === уборка и выход из реестра ===
            sudo docker image prune -f
            sudo docker logout ghcr.io

      - name: Deploy to test server
        if: github.ref == 'refs/heads/nstnkv'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.FINGERPRINT }}
          script_stop: true
          script: |
            set -euo pipefail
      
            # === переменные ===
            STACK_DIR=/srv/adboard
            COMPOSE_FILE=docker-compose.prod.yml
      
            cd "$STACK_DIR"
      
            # === обеспечить наличие docker compose ===
            if ! sudo docker compose version >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y docker-compose-plugin
              else
                apt-get update -y
                apt-get install -y docker-compose-plugin
              fi
            fi
      
            # === логин в GHCR (приватные образы) ===
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
            # === деплой ===
            sudo docker compose -f "$COMPOSE_FILE" pull
            sudo docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
      
            # === уборка и выход из реестра ===
            sudo docker image prune -f
            sudo docker logout ghcr.io
